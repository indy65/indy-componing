<div>
  <table>
    <tr>
      @for (column of columns(); track column) {
      <th>{{ column }}</th>
      }
    </tr>
    @for (item of items(); track item) {
      <tr>

        @for(column of columns(); track column){
          <td>{{item[column]}}</td>
          
        }
      </tr>
  
    }

  </table>

</div>
